name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/viewer.png"
      - "web/**"
      - "spec/fixtures/*.rvtrace"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE: /ruby-runtime-visualizer/viewer/
      - name: Assemble the site
        run: |
          mkdir -p site/traces
          cp docs/index.html docs/viewer.png site/
          cp -r web/dist site/viewer
          cp spec/fixtures/*.rvtrace site/traces/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
